<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<!-- Generated pages: edit terms.json, sample-criteria.json or template.html, then run build.py. -->
<style>
  :root { --bg: #f2f5f9; --surface: #fff; --fg: #141a26; --muted: #485268; --line: #cfd6e2; --link: #1d4fd7; --note: #e6eaf2; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10141c; --surface: #181e29; --fg: #e8ecf3; --muted: #a3aec2; --line: #2b3445; --link: #8db4ff; --note: #232b3a; color-scheme: dark; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .wrap { max-width: 46rem; margin-inline: auto; padding: 1.5rem 1rem 4rem; overflow-wrap: break-word; }
  .banner { border: 2px solid var(--link); border-radius: 8px; padding: .75rem 1rem; background: var(--surface); margin: 0; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 1.5rem 0 .5rem; }
  h2 { font-size: 1.3rem; line-height: 1.3; margin: 2rem 0 .5rem; }
  h3 { font-size: 1.15rem; line-height: 1.3; margin: 0 0 .25rem; }
  article h2 { margin-top: 0; }
  p { margin: .5rem 0; }
  a { color: var(--link); text-underline-offset: .15em; }
  a.term { text-decoration-style: dotted; text-decoration-thickness: 2px; }
  a:focus-visible, article:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin: 1rem 0; scroll-margin-top: 1rem; }
  article > span[id] { scroll-margin-top: 2rem; }
  article:target, article:has(> span:target) { border: 3px solid var(--link); }
  .meta { color: var(--muted); margin: .1rem 0; }
  .note { background: var(--note); border-radius: 6px; padding: .6rem .8rem; }
  .index { columns: 14rem; padding-left: 1.2rem; }
  .index li { padding-block: .15rem; }
  .key { margin: 0; }
  .key div { margin: .35rem 0; }
  .key dt { font-weight: 600; display: inline; }
  .key dt::after { content: ": "; }
  .key dd { display: inline; margin: 0; }
  .skip { position: absolute; left: -999rem; }
  .skip:focus { position: static; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="wrap">
<header><p class="banner"><strong>Prototype for discussion.</strong> Terms, wording, links and structure have not been approved by the Accessibility in the Metaverse Working Group. <a href="../../">Back to the site home page</a></p></header>
<main id="main" tabindex="-1">
{{body}}
</main>
</div>
</body>
</html>
